name: PR Autofill

# Workflow that populates the mechanical parts of the org PR template:
#   - Assignee = PR author (on every PR run, if nobody is assigned)
#   - Template itself, when the PR was opened without it (CLI, API, `--fill`),
#     or at the first push of a human-authored PR that never had it
#   - Title fix-ups: Conventional Commits type and Jira ID from the branch name
#   - Commit list in "Descrizione" (between the pr-autofill:commits markers)
#   - Jira link (from branch name; address from the org variable JIRA_BASE_URL)
#   - Change type, as text next to the Jira task (from the title prefix)
#   - "Controlli automatici": status lines for branch naming, CC compliance,
#     conflicts and reviewers. Status lines, not checkboxes: GitHub counts
#     every checkbox as a PR task, and these are not the author's tasks.
#
# Everything is deterministic: no AI is involved. The prose of the description
# comes from CodeRabbit (`@coderabbitai summary` placeholder), not from here.
#
# It is idempotent: replacements only happen on the `ID-XXXX` placeholder and
# between our own markers, so the author's own text is never overwritten.
#
# The remaining sections ("Come testare", "Screenshot", "Note", and the checkbox
# "Il codice è stato testato localmente") are intentionally left to the author.
#
# Triggers:
#   - workflow_call: invokable from per-repo trigger workflows (legacy usage,
#     before the org Ruleset).
#   - pull_request: invoked directly as a "Required Workflow" via Organization
#     Ruleset on target repos (all repos, except the ones listed in the
#     ruleset). This is when the real work (assign + autofill) happens.
#     Under the Ruleset only opened/synchronize/reopened start a run:
#     `edited` works only where the workflow is called from the repo itself,
#     so a title or body edit is picked up at the next push.
#     No run at all for PRs to another branch (e.g. `staging`: assignee by
#     hand), nor while a PR has merge conflicts (GitHub starts no
#     pull_request workflow then): the next push catches up.
#   - push (non-main): same workflow runs as a no-op on every push to feature
#     branches, so the "required workflow" rule (which checks each push SHA,
#     not just PR events) finds a successful run and lets the push through.
#     Without this, pushing to a brand-new branch would be blocked: the rule
#     would wait for a workflow run that never came (workflow only triggered
#     on PR events).
#
# A single job covers all cases: step-level conditionals decide what runs.

on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write
  issues: write    # addAssignees uses the issues API
  contents: read

jobs:
  autofill:
    runs-on: ubuntu-latest
    # Always run on push (so the required-workflow check is satisfied for
    # every SHA). On pull_request, skip PRs from forks — the default
    # GITHUB_TOKEN is read-only there.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      - name: Push event — no-op for required-workflow check
        # On push the autofill steps can't run (no PR context) and don't need
        # to: any PR opened on this branch will retrigger the workflow on
        # pull_request and do the real work. This step just provides a
        # successful step so the run's conclusion is "success", which is what
        # the org Ruleset's `workflows` rule looks for.
        if: github.event_name == 'push'
        run: |
          echo "Push event on branch '${GITHUB_REF#refs/heads/}'. No PR context, autofill skipped."
          echo "This run exists to satisfy the org-level required-workflow check."

      - name: Auto-assign author
        # On every PR run, only if nobody is assigned, only for human authors.
        # Not only on 'opened': GitHub starts no pull_request workflow while a
        # PR has merge conflicts, and under the Ruleset none either for a PR
        # opened on another branch and retargeted to main later (stacked PRs),
        # so the 'opened' run may never exist. The next push then catches up.
        # An existing assignee, author or not, is never touched.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.assignees[0] == null &&
          github.event.pull_request.user.type != 'Bot'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author],
              });
              core.info(`Assigned PR #${context.payload.pull_request.number} to ${author}.`);
            } catch (err) {
              // Outside collaborators are sometimes not assignable; don't fail
              // the workflow over it — just log and let the template step run.
              core.warning(`Could not assign ${author}: ${err.message}`);
            }

      - name: Populate template
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        with:
          script: |
            // Template population is best-effort: a GitHub API hiccup (e.g. a
            // transient 502 on pulls.get/pulls.update) must never fail this
            // required check, since it only fills cosmetic parts of the PR
            // template. Mirrors the try/catch in "Auto-assign author".
            try {
            // Re-fetch the PR to get a fresh `mergeable` value (the webhook
            // payload can be stale, especially right after `opened`). GitHub
            // computes it in the background: `null` means not yet, so ask
            // once more after a few seconds before showing it as pending.
            const getPr = () => github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            let { data: pr } = await getPr();
            if (pr.mergeable === null) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              ({ data: pr } = await getPr());
            }

            const branch = pr.head.ref;
            const originalTitle = pr.title;
            let title = originalTitle;
            const original = pr.body || '';
            let body = original;

            // ── 0. Template — inject it when the PR was opened without ─────
            // GitHub applies the template only in the web UI: `gh pr create`
            // with --body/--fill, the API and other tools open PRs with an
            // empty body or with the commit messages. On opened/reopened, and
            // on a push to a PR that never had it (no marker): the 'opened'
            // run does not exist for a PR opened with merge conflicts or on
            // another base branch and retargeted to main later. To drop the
            // template on purpose, delete it but keep the marker line: without
            // the marker the next push puts it back. Only for human authors:
            // bots (Dependabot) rewrite their own body on rebase and would
            // get the template again at every push.
            const injected = '<!-- pr-autofill:template -->';
            const lateInjection = !body.includes(injected) && pr.user.type !== 'Bot';
            if (['opened', 'reopened'].includes(context.payload.action) || lateInjection) {
              const readFile = async (repo, path, ref) => {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: context.repo.owner, repo, path, ...(ref ? { ref } : {}),
                  });
                  return data.content ? Buffer.from(data.content, 'base64').toString('utf8') : null;
                } catch (err) {
                  if (err.status === 404) return null;
                  throw err;
                }
              };
              // Repo template first (same locations GitHub looks at), then
              // the org default in the public Uniting-Group/.github repo.
              let template = null;
              for (const path of [
                '.github/pull_request_template.md', '.github/PULL_REQUEST_TEMPLATE.md',
                'pull_request_template.md', 'PULL_REQUEST_TEMPLATE.md',
                'docs/pull_request_template.md', 'docs/PULL_REQUEST_TEMPLATE.md',
              ]) {
                template = await readFile(context.repo.repo, path, pr.base.ref);
                if (template) break;
              }
              template = template || await readFile('.github', 'PULL_REQUEST_TEMPLATE.md');
              // The template counts as present when the body has our marker
              // (left by a previous injection, so a reopen never adds a
              // second copy, however much the author edited it), or one of
              // the template's opening text or HTML comments (stable: the web
              // UI copies them and authors rarely touch them, and they cover
              // plain templates without `##` headings), or at least half of
              // its headings — whatever the template's own wording is.
              const headings = template ? template.match(/^#{2,3} .+$/gm) || [] : [];
              const comments = template ? template.match(/<!--[\s\S]*?-->/g) || [] : [];
              const found = headings.filter((h) => body.includes(h)).length;
              const opening = template ? template.trim().slice(0, 200) : '';
              const hasTemplate = body.includes(injected)
                || (opening && body.includes(opening))
                || comments.some((c) => body.includes(c))
                || (headings.length > 0 && found * 2 >= headings.length);
              if (hasTemplate && !body.includes(injected)) {
                // Recognised now, maybe not after the replacements below
                // (e.g. `ID-XXXX` in the opening text): mark it for good.
                body = `${body.trimEnd()}\n\n${injected}\n`;
              }
              if (template && !hasTemplate) {
                // Keep what the author wrote (e.g. commit bodies from
                // `--fill`) in "Note", or at the end if the template has none.
                // A CodeRabbit summary already in the body (it writes one when
                // it finds no placeholder, e.g. before a late injection on
                // push) takes the place of the `@coderabbitai summary`
                // placeholder instead, so it is neither moved to "Note" nor
                // written twice.
                let authorText = body.trim();
                body = `${template.trimEnd()}\n\n${injected}\n`;
                const summary = authorText.match(/<!-- This is an auto-generated comment: release notes by coderabbit\.ai -->[\s\S]*?<!-- end of auto-generated comment: release notes by coderabbit\.ai -->/);
                if (summary && body.includes('@coderabbitai summary')) {
                  body = body.replace('@coderabbitai summary', () => summary[0]);
                  authorText = authorText.replace(summary[0], '').trim();
                }
                if (authorText) {
                  const note = /## Note[^\n]*\n(?:\s*<!--[\s\S]*?-->\n)?/;
                  body = note.test(body)
                    ? body.replace(note, (m) => `${m}\n${authorText}\n`)
                    : `${body}\n\n${authorText}\n`;
                }
              }
            }

            // Follows the org convention from Uniting-Group/org-project
            // GIT-WORKFLOW.md §3:
            //   <tipo>/<JIRA-ID>
            //   <tipo>/<JIRA-ID>_<breve_descrizione>
            // Tipo is feat|fix|refactor|chore|docs (GIT-WORKFLOW §3, the five
            // CI-whitelisted prefixes). Any Jira project prefix is
            // accepted (2–10 uppercase letters), so MCP, ST, FLU, CMAI, ID,
            // etc. all work. The optional descriptive slug accepts `_` (per
            // the docs) or `-` (accepted in practice) as separator. Anchored
            // at end ($) to reject malformed suffixes like `MCP-145abc`.
            const branchPattern = /^(feat|fix|refactor|chore|docs)\/([A-Z]{2,10}-\d+)([_-][A-Za-z0-9_-]+)?$/i;
            const branchMatch = branch.match(branchPattern);

            // ── 0b. Title — Conventional Commits type and Jira ID ──────────
            // Deterministic fix-ups only, the wording stays the author's:
            //   - no CC type → the branch type (`feat/ONE-1_x` → `feat:`)
            //   - a title that is just the branch name (default of the web UI
            //     and of `--fill` with several commits) → the branch slug
            //   - the branch Jira ID missing from the title → added right
            //     after the type (other IDs in the title stay as references)
            //   - a result over GitHub's 256-character limit → title untouched
            // The bare `@coderabbitai` placeholder is left alone: CodeRabbit
            // rewrites it, with the Jira ID (org `auto_title_instructions`).
            // A title edit does not re-run this workflow under the Ruleset
            // (only opened/synchronize/reopened do), so anything CodeRabbit
            // leaves out is completed at the next push.
            if (branchMatch && title.trim() !== '@coderabbitai') {
              const jiraId = branchMatch[2].toUpperCase();
              const typePrefix = /^(feat|fix|hotfix|refactor|chore|docs|test|style|build|perf|ci)(\([^)]+\))?!?:\s*/i;
              let subject = title.trim();
              let prefix = `${branchMatch[1].toLowerCase()}:`;
              const typeMatch = subject.match(typePrefix);
              if (typeMatch) {
                prefix = typeMatch[0].trim();
                subject = subject.slice(typeMatch[0].length);
              } else {
                const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (norm(subject) === norm(branch)) {
                  subject = (branchMatch[3] || '').replace(/[_-]+/g, ' ').trim();
                }
              }
              // The branch ID already there is kept where it is: a leading one
              // only loses its brackets (`[ONE-1]`), one later in the text
              // (`feat: risolve ONE-1`) is not duplicated. Case-sensitive and
              // on the exact ID, so `UTF-8` or another task's ID don't count.
              const escaped = jiraId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const leading = subject.match(new RegExp(`^\\[?${escaped}\\]?(?!\\d)[\\s:–-]*`));
              let id = jiraId;
              if (leading) {
                subject = subject.slice(leading[0].length);
              } else if (new RegExp(`\\b${escaped}\\b`).test(subject)) {
                id = null;
              }
              const candidate = [prefix, id, subject].filter(Boolean).join(' ');
              if (candidate.length <= 256) title = candidate;
            }

            // ── 0c. Commit list in "Descrizione" ───────────────────────────
            // Rewritten on every run between our markers, so it follows pushes.
            const commitsStart = '<!-- pr-autofill:commits:start -->';
            const commitsEnd = '<!-- pr-autofill:commits:end -->';
            const startAt = body.indexOf(commitsStart);
            const endAt = body.indexOf(commitsEnd);
            if (startAt !== -1 && endAt > startAt) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              // Merge commits (e.g. "Merge branch 'main'") say nothing about
              // the change. `<` and `@` are neutralised so a subject can
              // neither break our markers nor mention someone. The list is
              // bounded (count and subject length) to stay well within the
              // 65,536-character limit of the PR body, and keeps the latest
              // commits, so a push always shows up. The endpoint returns only
              // the first 250 commits: past that the list is partial and may
              // miss the newest ones, and the note says so.
              const maxCommits = 100;
              const maxSubject = 200;
              const own = commits.filter((c) => (c.parents || []).length < 2);
              const shown = own.slice(-maxCommits);
              const lines = shown.map((c) => {
                let subject = c.commit.message.split('\n')[0];
                if (subject.length > maxSubject) subject = `${subject.slice(0, maxSubject)}…`;
                subject = subject.replace(/</g, '&lt;').replace(/@/g, '@&#8203;');
                return `- ${subject} (${c.sha.slice(0, 7)})`;
              });
              if (pr.commits > commits.length) {
                lines.unshift(`- ⚠️ La PR ha ${pr.commits} commit e GitHub ne restituisce solo i primi ${commits.length}: l'elenco è parziale e può non includere i più recenti (vedi la scheda *Commits*)`);
              } else if (own.length > shown.length) {
                lines.unshift('- … commit precedenti non elencati (vedi la scheda *Commits*)');
              }
              const list = lines.join('\n') || '_Nessun commit._';
              body = body.slice(0, startAt + commitsStart.length)
                + `\n${list}\n`
                + body.slice(endAt);
            }

            // Rewrites the text between our own start/end markers, like the
            // commit list: the author never edits it, so it always follows
            // the PR. Bodies without the markers (template of another repo,
            // older org template) are left alone.
            const fill = (name, text) => {
              const start = `<!-- pr-autofill:${name}:start -->`;
              const end = `<!-- pr-autofill:${name}:end -->`;
              const s = body.indexOf(start);
              const e = body.indexOf(end);
              if (s !== -1 && e > s) {
                body = body.slice(0, s + start.length) + text + body.slice(e);
              }
            };

            // ── 1. Jira ID from branch name ───────────────────────────────
            // The task link is built here, from the org variable
            // JIRA_BASE_URL: the template lives in a public repo, so it
            // carries no Jira address. Without the variable, the bare ID.
            // A branch without the ID leaves the task as the author wrote it.
            if (branchMatch) {
              const jiraId = branchMatch[2].toUpperCase();
              body = body.split('ID-XXXX').join(jiraId);
              const jiraBase = (process.env.JIRA_BASE_URL || '').replace(/\/+$/, '');
              fill('task', jiraBase ? `[${jiraId}](${jiraBase}/browse/${jiraId})` : jiraId);
            }

            // ── 2. Type — from the Conventional Commits prefix of the title ─
            // Shown as text next to the Jira task, not as checkboxes: GitHub
            // counts every checkbox of the body as a PR task, and the type is
            // a single choice already in the title. Same types the title fix-up
            // keeps (GIT-WORKFLOW §7, plus `ci`). `hotfix` is still
            // accepted as input (legacy habit) but shown as `fix`: it is not a
            // valid type per GIT-WORKFLOW §7.
            const ccMatch = title.match(/^(feat|fix|hotfix|refactor|chore|docs|test|style|build|perf|ci)(\([^)]+\))?!?:\s/i);
            const ccType = ccMatch ? ccMatch[1].toLowerCase() : null;
            const typeLabels = {
              feat:     '`feat` — Nuova funzionalità',
              fix:      '`fix` — Correzione bug',
              hotfix:   '`fix` — Correzione bug',
              refactor: '`refactor` — Refactoring (nessun cambiamento funzionale)',
              chore:    '`chore` — Manutenzione / aggiornamento dipendenze',
              docs:     '`docs` — Documentazione',
              test:     '`test` — Test',
              style:    '`style` — Formattazione, nessun cambio logico',
              build:    '`build` — Build, CI/CD, Docker',
              perf:     '`perf` — Miglioramento performance',
              ci:       '`ci` — CI/CD',
            };
            fill('type', ccType
              ? typeLabels[ccType]
              : 'da indicare nel titolo (`feat:`, `fix:`, `refactor:`, `chore:`, `docs:`)');

            // ── 3. Automatic checks — status lines, not checkboxes ─────────
            // Same reason as the type: these are states the workflow
            // verifies, not tasks of the author. Rewritten at every run, so
            // they reflect the PR at the last open or push.
            const author = pr.user.login;
            const human = (u) => u && u.type !== 'Bot' && u.login !== author;
            const reviewers = new Set([
              ...(pr.requested_reviewers || []).filter(human).map((u) => `\`${u.login}\``),
              ...(pr.requested_teams || []).map((tm) => `team \`${tm.slug}\``),
            ]);
            if (reviewers.size === 0) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              reviews
                .filter((r) => human(r.user) && r.state !== 'DISMISSED')
                .forEach((r) => reviewers.add(`\`${r.user.login}\``));
            }
            const base = `\`${pr.base.ref}\``;
            // Logins in backticks, never `@`: a status line must not notify.
            const checks = [
              branchMatch
                ? '✅ Branch conforme alla convenzione `(feat|fix|refactor|chore|docs)/<JIRA-ID>`'
                : '❌ Branch fuori convenzione: serve `(feat|fix|refactor|chore|docs)/<JIRA-ID>`, altrimenti la CI blocca il merge',
              ccType
                ? '✅ Titolo in [Conventional Commits](https://www.conventionalcommits.org/)'
                : '❌ Titolo non in [Conventional Commits](https://www.conventionalcommits.org/): manca il tipo (`feat:`, `fix:`…)',
              pr.mergeable === true ? `✅ Nessun conflitto con ${base}`
                : pr.mergeable === false ? `❌ Conflitti con ${base}: risolvili e pusha`
                : `⏳ Conflitti con ${base} ancora da calcolare: si aggiorna al prossimo push`,
              reviewers.size > 0
                ? `✅ Reviewer: ${[...reviewers].join(', ')}`
                : '⚠️ Nessun reviewer: dopo la review AI chiedi la review ad almeno un collega dal campo Reviewers',
            ];
            fill('checks', `\n${checks.map((c) => `- ${c}`).join('\n')}\n`);

            // A body over GitHub's limit would make the update fail, title
            // included: in that case leave the body as it was.
            if (body.length > 65536) {
              core.warning(`PR body would be ${body.length} characters, over GitHub's limit: body left unchanged.`);
              body = original;
            }

            // ── Apply only if something changed (prevents edit-event loops) ─
            if (body === original && title === originalTitle) {
              core.info('No changes needed — body and title already up to date.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              ...(body !== original ? { body } : {}),
              ...(title !== originalTitle ? { title } : {}),
            });
            core.info(`PR #${pr.number} updated (${[
              body !== original && 'body',
              title !== originalTitle && `title → "${title}"`,
            ].filter(Boolean).join(', ')}).`);
            } catch (err) {
              // Swallow API/runtime errors so a transient GitHub failure on a
              // purely cosmetic step can't block the PR. Surface it as a
              // warning for visibility instead of failing the required check.
              core.warning(`PR Autofill: template population skipped (${err.status || 'error'}): ${err.message}`);
            }
