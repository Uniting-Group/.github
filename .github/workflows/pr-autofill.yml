name: PR Autofill

# Workflow that populates the mechanical parts of the org PR template:
#   - Assignee = PR author (on 'opened', if no assignees yet)
#   - Jira link (from branch name)
#   - "Tipo di modifica" checkbox (from Conventional Commits prefix in title)
#   - First three "Checklist" items (branch naming, CC compliance, no conflicts)
#
# It is idempotent: replacements only happen on the verbatim template strings,
# so manual edits by the author are never overwritten.
#
# The remaining sections ("Come testare", "Screenshot", "Note", and the checkboxes
# "Il codice è stato testato localmente" / "Ho assegnato almeno un reviewer") are
# intentionally left to the author.
#
# Triggers:
#   - workflow_call: invokable from per-repo trigger workflows (legacy usage,
#     before the org Ruleset).
#   - pull_request: invoked directly as a "Required Workflow" via Organization
#     Ruleset on target repos (today: st-*, mcp-*, ctx-*). This is when the
#     real work (assign + autofill) happens.
#   - push (non-main): same workflow runs as a no-op on every push to feature
#     branches, so the "required workflow" rule (which checks each push SHA,
#     not just PR events) finds a successful run and lets the push through.
#     Without this, pushing to a brand-new branch would be blocked: the rule
#     would wait for a workflow run that never came (workflow only triggered
#     on PR events).
#
# A single job covers all cases: step-level conditionals decide what runs.

on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write
  issues: write    # addAssignees uses the issues API
  contents: read

jobs:
  autofill:
    runs-on: ubuntu-latest
    # Always run on push (so the required-workflow check is satisfied for
    # every SHA). On pull_request, skip PRs from forks — the default
    # GITHUB_TOKEN is read-only there.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      - name: Push event — no-op for required-workflow check
        # On push the autofill steps can't run (no PR context) and don't need
        # to: any PR opened on this branch will retrigger the workflow on
        # pull_request and do the real work. This step just provides a
        # successful step so the run's conclusion is "success", which is what
        # the org Ruleset's `workflows` rule looks for.
        if: github.event_name == 'push'
        run: |
          echo "Push event on branch '${GITHUB_REF#refs/heads/}'. No PR context, autofill skipped."
          echo "This run exists to satisfy the org-level required-workflow check."

      - name: Auto-assign author
        # Only on initial open, only if nobody is already assigned, only for
        # human authors. Edits/syncs/reopens leave existing assignees alone so
        # a deliberate manual re-assignment is not undone.
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'opened' &&
          github.event.pull_request.assignees[0] == null &&
          github.event.pull_request.user.type != 'Bot'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author],
              });
              core.info(`Assigned PR #${context.payload.pull_request.number} to ${author}.`);
            } catch (err) {
              // Outside collaborators are sometimes not assignable; don't fail
              // the workflow over it — just log and let the template step run.
              core.warning(`Could not assign ${author}: ${err.message}`);
            }

      - name: Populate template
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Re-fetch the PR to get a fresh `mergeable` value (the webhook
            // payload can be stale, especially right after `opened`).
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const branch = pr.head.ref;
            const title = pr.title;
            const original = pr.body || '';
            let body = original;

            // ── 1. Jira ID from branch name ───────────────────────────────
            // Follows the org convention from Uniting-Group/org-project
            // GIT-WORKFLOW.md §3:
            //   <tipo>/<JIRA-ID>
            //   <tipo>/<JIRA-ID>_<breve_descrizione>
            // Tipo is feature|hotfix|chore. Any Jira project prefix is
            // accepted (2–10 uppercase letters), so MCP, ST, FLU, CMAI, ID,
            // etc. all work. The optional descriptive slug accepts `_` (per
            // the docs) or `-` (accepted in practice) as separator. Anchored
            // at end ($) to reject malformed suffixes like `MCP-145abc`.
            const branchPattern = /^(feature|hotfix|chore)\/([A-Z]{2,10}-\d+)([_-][A-Za-z0-9_-]+)?$/i;
            const branchMatch = branch.match(branchPattern);
            if (branchMatch) {
              const jiraId = branchMatch[2].toUpperCase();
              body = body.split('ID-XXXX').join(jiraId);
            }

            // ── 2. Tipo di modifica — check the box matching the CC prefix ─
            // Matches: feat: / fix(scope): / hotfix!: / refactor: / chore: / docs: / test:
            const ccMatch = title.match(/^(feat|fix|hotfix|refactor|chore|docs|test)(\([^)]+\))?!?:\s/i);
            let ccType = null;
            if (ccMatch) {
              ccType = ccMatch[1].toLowerCase();
              const typeLabels = {
                feat:     '`feat` — Nuova funzionalità',
                fix:      '`fix` / `hotfix` — Correzione bug',
                hotfix:   '`fix` / `hotfix` — Correzione bug',
                refactor: '`refactor` — Refactoring (nessun cambiamento funzionale)',
                chore:    '`chore` — Manutenzione / aggiornamento dipendenze',
                docs:     '`docs` — Documentazione',
                test:     '`test` — Test',
              };
              const label = typeLabels[ccType];
              if (label) {
                // Only tick if no "Tipo di modifica" box has been ticked yet,
                // to avoid overwriting a manual choice that differs from the
                // title (rare, but possible).
                const typeSection = (body.split('## Checklist')[0] || '');
                const alreadyTicked = /## Tipo di modifica[\s\S]*?- \[x\]/i.test(typeSection);
                if (!alreadyTicked) {
                  body = body.replace(`- [ ] ${label}`, `- [x] ${label}`);
                }
              }
            }

            // ── 3. Checklist — branch naming convention ────────────────────
            // Toggle both ways so the box correctly reflects the *current*
            // state if the branch gets renamed (or the PR targets a stale one).
            if (branchMatch) {
              body = body.replace(
                '- [ ] Il branch segue la convenzione `(feature|hotfix|chore)/<JIRA-ID>`',
                '- [x] Il branch segue la convenzione `(feature|hotfix|chore)/<JIRA-ID>`',
              );
            } else {
              body = body.replace(
                '- [x] Il branch segue la convenzione `(feature|hotfix|chore)/<JIRA-ID>`',
                '- [ ] Il branch segue la convenzione `(feature|hotfix|chore)/<JIRA-ID>`',
              );
            }

            // ── 4. Checklist — Conventional Commits ────────────────────────
            // Toggle both ways so a title edit that breaks CC compliance
            // flips the box back to unchecked.
            if (ccType) {
              body = body.replace(
                '- [ ] I commit seguono i [Conventional Commits](https://www.conventionalcommits.org/)',
                '- [x] I commit seguono i [Conventional Commits](https://www.conventionalcommits.org/)',
              );
            } else {
              body = body.replace(
                '- [x] I commit seguono i [Conventional Commits](https://www.conventionalcommits.org/)',
                '- [ ] I commit seguono i [Conventional Commits](https://www.conventionalcommits.org/)',
              );
            }

            // ── 5. Checklist — no conflicts with main ──────────────────────
            // pr.mergeable is `true` / `false` / `null` (still computing).
            if (pr.mergeable === true) {
              body = body.replace(
                '- [ ] Non ci sono conflitti con `main`',
                '- [x] Non ci sono conflitti con `main`',
              );
            } else if (pr.mergeable === false) {
              // Flip it back if the branch has gained conflicts since last run.
              body = body.replace(
                '- [x] Non ci sono conflitti con `main`',
                '- [ ] Non ci sono conflitti con `main`',
              );
            }

            // ── Apply only if something changed (prevents edit-event loops) ─
            if (body === original) {
              core.info('No changes needed — body already up to date.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body,
            });
            core.info(`PR #${pr.number} body updated.`);
