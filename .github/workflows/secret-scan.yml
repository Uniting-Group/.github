name: Secret scan

# gitleaks sui commit nuovi di ogni push e di ogni PR (ONE-1175).
#
# Distribuito come Required Workflow tramite Org Ruleset: nessun file da
# aggiungere ai repo. Il ruleset lo rende obbligatorio per il merge sul branch
# di default; la scelta degli strumenti è nell'ADR
# org-project/adr/0001-analisi-del-codice.md.
#
# Sostituisce la push protection del secret scanning, che sui repo privati
# richiede GitHub Secret Protection: qui il segreto viene fermato prima del
# merge, non prima del push. Se scatta, il segreto va considerato esposto e
# ruotato, non solo rimosso dalla PR (procedura nella secure development
# policy di org-project).
#
# Cosa viene scansionato:
#   - pull_request: i commit della PR (base..head);
#   - push su un branch diverso dal default: i commit appena pushati
#     (before..after), o quelli non ancora sul default se il branch è nuovo.
#     Copre anche le PR verso `staging`, dove il Ruleset non avvia il workflow.
#   - Il default branch nel suo insieme (storia completa) lo copre la
#     scansione settimanale centralizzata (org-config, security-scan.yml).
#
# Fiducia: sotto il Ruleset il workflow arriva da Uniting-Group/.github@main,
# quindi una PR non può toglierlo o ammorbidirlo. Regole ed esclusioni
# (.gitleaks.toml, .gitleaksignore) si leggono dal branch di default del repo,
# non dalla PR; i commenti inline "gitleaks:allow" sono ignorati.
# Il job non esegue codice del repo e ha il solo GITHUB_TOKEN in lettura.

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Binario pinnato a versione + SHA-256 della release ufficiale (file
      # gitleaks_<v>_checksums.txt): niente action di terzi né licenza.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLf -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            # Branch nuovo (o force-push su una storia sconosciuta): i commit
            # che non sono ancora sul branch di default.
            range="origin/${DEFAULT_BRANCH}..${AFTER}"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Commit da scansionare: $(git rev-list --count "$range")"

      # Regole ed esclusioni del branch di default, non della PR. Senza un
      # .gitleaks.toml del repo vale la configurazione di organizzazione
      # (security/gitleaks.toml di Uniting-Group/.github, stesso branch da cui
      # arriva questo workflow); se non si riesce a scaricarla, le regole
      # predefinite di gitleaks.
      - name: Use trusted gitleaks config
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ORG_CONFIG_URL: https://raw.githubusercontent.com/Uniting-Group/.github/main/security/gitleaks.toml
        run: |
          rm -f .gitleaks.toml .gitleaksignore
          mkdir -p "$RUNNER_TEMP/gitleaks-conf"
          ref="origin/${DEFAULT_BRANCH}"
          if git cat-file -e "${ref}:.gitleaks.toml" 2>/dev/null; then
            git show "${ref}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks-conf/gitleaks.toml"
            echo "GITLEAKS_CONFIG=$RUNNER_TEMP/gitleaks-conf/gitleaks.toml" >> "$GITHUB_ENV"
          elif curl -sSLf -o "$RUNNER_TEMP/gitleaks-conf/gitleaks.toml" "$ORG_CONFIG_URL"; then
            echo "GITLEAKS_CONFIG=$RUNNER_TEMP/gitleaks-conf/gitleaks.toml" >> "$GITHUB_ENV"
          else
            echo "::warning::Configurazione di organizzazione non raggiungibile: regole predefinite di gitleaks."
          fi
          if git cat-file -e "${ref}:.gitleaksignore" 2>/dev/null; then
            git show "${ref}:.gitleaksignore" > "$RUNNER_TEMP/gitleaks-conf/.gitleaksignore"
          fi

      # --diff-merges=remerge: gitleaks usa git log -p, che per i merge commit
      # non mostra la patch. Con remerge si vede solo quello che chi risolve un
      # conflitto ha cambiato rispetto al merge automatico.
      # --redact: il valore del segreto non compare mai nel log.
      - name: Scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--diff-merges=remerge ${RANGE}" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-conf" \
            --ignore-gitleaks-allow --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 1
          rc=$?
          set -e
          n=$(jq length "$RUNNER_TEMP/gitleaks.json" 2>/dev/null || echo 0)
          {
            echo "## Secret scan"
            echo
            echo "Commit scansionati: \`${RANGE}\`"
            echo
            if [ "$n" -gt 0 ]; then
              echo "**${n} possibili segreti.** Il segreto va considerato esposto: ruotarlo, poi toglierlo dal branch."
              echo "Un falso positivo si esclude con una riga in \`.gitleaksignore\` sul branch di default (fingerprint qui sotto), con una PR a parte."
              echo
              echo "| Regola | File | Riga | Commit | Fingerprint |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[:8])` | `\(.Fingerprint)` |"' "$RUNNER_TEMP/gitleaks.json"
            else
              echo "Nessun segreto trovato."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
