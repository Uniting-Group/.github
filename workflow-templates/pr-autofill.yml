name: PR Autofill

# Trigger workflow — delegates to the reusable workflow in Uniting-Group/.github.
# Auto-assigns the PR author and populates Jira link, Tipo di modifica, and
# Checklist items of the org PR template. Safe to enable on any repo in the org.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write    # required to assign the PR author via the issues API
  contents: read

jobs:
  autofill:
    uses: Uniting-Group/.github/.github/workflows/pr-autofill.yml@main
